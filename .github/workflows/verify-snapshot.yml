name: Verify snapshot (instructor)

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out complete reference
        uses: actions/checkout@v7
        with:
          ref: solution
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r week5/requirements-dev.txt
      - name: Test complete reference
        run: python -m pytest week5/test_main.py -v -W error::sklearn.exceptions.InconsistentVersionWarning
      - name: Build reference image on native CPU
        run: docker build -f week5/Dockerfile -t week5-reference:ci .
      - run: docker run -d --name week5-reference -p 8000:8000 week5-reference:ci
      - name: Test real prediction in Docker
        run: python week5/smoke.py
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs week5-reference || true
          docker rm -f week5-reference || true
      - name: Check out starter
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Check starter API and deliberate TODOs
        run: |
          python -m uvicorn week4.main:app --host 127.0.0.1 --port 8001 > /tmp/week5-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID"; cat /tmp/week5-api.log' EXIT
          python week5/smoke.py http://127.0.0.1:8001
          python - <<'PY'
          import subprocess
          result = subprocess.run(['python', '-m', 'pytest', 'week5/test_main.py', '-q'], capture_output=True, text=True)
          print(result.stdout)
          print(result.stderr)
          assert result.returncode == 1 and '3 failed' in result.stdout and 'TODO:' in result.stdout
          PY
