# STEP 3: 이 파일을 저장소 루트의 .github/workflows/ci.yml로 복사합니다.
name: Week 5 CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            week4/requirements.txt
            week5/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r week5/requirements-dev.txt
      - name: Test API
        run: python -m pytest week5/test_main.py -v

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -f week5/Dockerfile -t week5-api:ci .
      - name: Start container
        run: docker run -d --name week5-api -p 8000:8000 week5-api:ci
      - name: Verify real HTTP prediction
        run: python3 week5/smoke.py
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs week5-api || true
          docker rm -f week5-api || true

  publish:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch &&
      vars.ENABLE_DOCKERHUB_PUSH == 'true'
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'bitamin-mlops-week5' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check registry settings
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Missing DOCKERHUB_USERNAME Secret'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Missing DOCKERHUB_TOKEN Secret'; exit 1; }
          echo "Publishing docker.io/$DOCKERHUB_USERNAME/$IMAGE_NAME"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Intel / Apple Silicon images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: week5/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Verify published image
        run: |
          IMAGE="$DOCKERHUB_USERNAME/$IMAGE_NAME:${GITHUB_SHA}"
          docker buildx imagetools inspect "$IMAGE"
          docker pull "$IMAGE"
          docker run -d --name week5-published -p 8000:8000 "$IMAGE"
          python3 week5/smoke.py
      - name: Published container logs and cleanup
        if: always()
        run: |
          docker logs week5-published || true
          docker rm -f week5-published || true
