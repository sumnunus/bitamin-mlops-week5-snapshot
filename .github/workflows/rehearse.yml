name: Rehearse Docker Hub (instructor)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week5-instructor-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify-snapshot.yml
  publish:
    needs: verify
    if: vars.ENABLE_DOCKERHUB_PUSH == 'true'
    runs-on: ubuntu-24.04
    outputs:
      image_sha: ${{ steps.revision.outputs.sha }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'bitamin-mlops-week5' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: solution
      - name: Check registry settings
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Missing DOCKERHUB_USERNAME Secret'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Missing DOCKERHUB_TOKEN Secret'; exit 1; }
          echo "Publishing docker.io/$DOCKERHUB_USERNAME/$IMAGE_NAME"
      - name: Resolve image commit
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Intel / Apple Silicon images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: week5/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.revision.outputs.sha }}
      - name: Verify published image
        env:
          IMAGE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          IMAGE="$DOCKERHUB_USERNAME/$IMAGE_NAME:${IMAGE_SHA}"
          docker buildx imagetools inspect "$IMAGE"
          docker pull "$IMAGE"
          docker run -d --name week5-published -p 8000:8000 "$IMAGE"
          python3 week5/smoke.py
      - name: Published container logs and cleanup
        if: always()
        run: |
          docker logs week5-published || true
          docker rm -f week5-published || true

  verify-published:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'bitamin-mlops-week5' }}
      IMAGE_SHA: ${{ needs.publish.outputs.image_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: solution
      - name: Pull published image on native CPU
        run: |
          test -n "$IMAGE_SHA"
          docker pull "$DOCKERHUB_USERNAME/$IMAGE_NAME:$IMAGE_SHA"
          docker run -d --name week5-delivered -p 8000:8000 "$DOCKERHUB_USERNAME/$IMAGE_NAME:$IMAGE_SHA"
      - name: Verify delivered model via real HTTP
        run: python3 week5/smoke.py
      - name: Published container logs and cleanup
        if: always()
        run: |
          docker logs week5-delivered || true
          docker rm -f week5-delivered || true
